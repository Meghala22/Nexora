services:
  - type: web
    name: nexora-banking-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: NEXORA_EVENTS_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://celadon-bombolone-c12dc9.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: nexora-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: nexora-postgres
          property: password

databases:
  - name: nexora-postgres
    plan: free
    databaseName: nexora
    user: nexora
