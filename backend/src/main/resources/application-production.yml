spring:
  datasource:
    # Render exposes a postgresql:// URL; the JDBC driver requires jdbc:postgresql://.
    url: jdbc:${DATABASE_URL}
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    listener:
      auto-startup: false

# Kafka is deliberately disabled in the first public deployment. Enable
# NEXORA_EVENTS_ENABLED only after supplying a managed Kafka bootstrap URL.
nexora:
  events:
    enabled: ${NEXORA_EVENTS_ENABLED:false}
